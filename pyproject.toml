[project]
name = "ai-paper-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.252.0",
    "constructs>=10.0.0,<11.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambdas/pipeline", "."]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "boto3>=1.43.3",
    "feedparser>=6.0.12",
    "moto>=5.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "requests>=2.33.1",
    "requests-mock>=1.12.1",
    "ruff>=0.15.12",
    "tenacity>=9.1.4",
    "types-requests>=2.33.0.20260503",
]
